name: Build Windows EXE

on:
  push:
    branches: [main]
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装依赖
        run: pip install pdfplumber pdf2image Pillow pytesseract pyinstaller

      - name: 打包为 EXE
        run: pyinstaller --onefile --windowed --name "InvoiceRenamer" invoice_app.py

      - name: 发布到 Release
        shell: pwsh
        run: |
          gh release create $env:GITHUB_REF_NAME dist\InvoiceRenamer.exe `
            --title "发票识别工具 $env:GITHUB_REF_NAME" `
            --notes "下载 InvoiceRenamer.exe 即可使用。"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
