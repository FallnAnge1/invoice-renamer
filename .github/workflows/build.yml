name: Build Windows Portable Package

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: windows-portable-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run regression tests
        # Resolve Windows runner TEMP aliases before creating test fixtures.
        run: python -c "import tempfile, unittest; from pathlib import Path; tempfile.tempdir = str(Path(tempfile.gettempdir()).resolve()); result = unittest.TextTestRunner().run(unittest.defaultTestLoader.discover('.')); raise SystemExit(not result.wasSuccessful())"
      - name: Prepare bundled Chinese and English OCR
        shell: pwsh
        run: ./scripts/prepare_windows_ocr.ps1
      - name: Build portable package
        shell: pwsh
        run: ./scripts/build_windows_release.ps1
      - name: Verify packaged executable
        shell: pwsh
        run: |
          $isolated = Join-Path $env:RUNNER_TEMP "invoice-single-exe-test"
          New-Item -ItemType Directory -Path $isolated -Force | Out-Null
          Copy-Item "release/invoice-renamer-windows.exe" (Join-Path $isolated "invoice-renamer-windows.exe")
          $app = Start-Process -FilePath (Join-Path $isolated "invoice-renamer-windows.exe") -WorkingDirectory $isolated -ArgumentList @("--self-test", "result") -WindowStyle Hidden -PassThru -Wait
          if ($app.ExitCode -ne 0) { throw "Packaged smoke test failed" }
          $report = Get-Content (Join-Path $isolated "result/report.json") -Raw | ConvertFrom-Json
          if (-not $report.passed -or -not $report.onefile) { throw "Single EXE validation failed" }
          $report | ConvertTo-Json -Depth 5
      - uses: actions/upload-artifact@v4
        with:
          name: invoice-renamer-windows
          path: release/*
          if-no-files-found: error
      - name: Publish a verified new version
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (python -c "from app_version import VERSION; print(VERSION)").Trim()
          if ($LASTEXITCODE -ne 0 -or $version -notmatch '^\d+\.\d+\.\d+$') { throw "Invalid version" }
          $tag = "v$version"
          gh release view "$tag" *> $null
          if ($LASTEXITCODE -eq 0) { Write-Host "Release $tag already exists; keeping existing assets."; exit 0 }
          gh release create "$tag" "release/invoice-renamer-windows.exe" "release/invoice-renamer-windows.exe.sha256" "release/THIRD_PARTY_NOTICES.md" "release/使用说明.txt" --target "$env:GITHUB_SHA" --title "$tag · 发票与文档助手（单 EXE 版）" --notes-file RELEASE_NOTES.md --latest
          if ($LASTEXITCODE -ne 0) { throw "Release publication failed" }
