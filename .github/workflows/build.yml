name: Build Windows EXE

on:
  push:
    branches: [main]
    tags:
      - "v*"
  workflow_dispatch:  # 允许手动触发

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
      actions: read

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装依赖
        run: pip install pdfplumber pdf2image Pillow pytesseract pyinstaller

      - name: 打包为 EXE
        run: pyinstaller --onefile --windowed --name "发票识别工具" invoice_app.py

      - name: 发布到 Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist\发票识别工具.exe
          tag_name: ${{ github.ref_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
