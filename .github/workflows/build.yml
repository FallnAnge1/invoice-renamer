name: Build Windows EXE

on:
  push:
    branches: [main]
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装依赖
        run: pip install pdfplumber pdf2image Pillow pytesseract pyinstaller

      - name: 打包为 EXE
        run: |
          pyinstaller --onefile --windowed --name "InvoiceRenamer" invoice_app.py
          Move-Item -Path dist\InvoiceRenamer.exe -Destination 发票识别工具.exe

      - name: 发布到 Release
        uses: softprops/action-gh-release@v2
        with:
          files: 发票识别工具.exe
          tag_name: ${{ github.ref_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
