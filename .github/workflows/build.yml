name: Build Windows Portable Package

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: windows-portable-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run regression tests
        # Resolve Windows runner TEMP aliases before creating test fixtures.
        run: python -c "import tempfile, unittest; from pathlib import Path; tempfile.tempdir = str(Path(tempfile.gettempdir()).resolve()); result = unittest.TextTestRunner().run(unittest.defaultTestLoader.discover('.')); raise SystemExit(not result.wasSuccessful())"
      - name: Prepare bundled Chinese and English OCR
        shell: pwsh
        run: ./scripts/prepare_windows_ocr.ps1
      - name: Build portable package
        shell: pwsh
        run: ./scripts/build_windows_release.ps1
      - name: Verify packaged executable
        shell: pwsh
        run: |
          $app = Start-Process -FilePath "release/发票识别工具/发票识别工具.exe" -ArgumentList @("--self-test", "build-assets/smoke-test") -WindowStyle Hidden -PassThru -Wait
          if ($app.ExitCode -ne 0) { throw "Packaged smoke test failed" }
          Get-Content "build-assets/smoke-test/report.json"
      - uses: actions/upload-artifact@v4
        with:
          name: invoice-renamer-windows
          path: release/invoice-renamer-windows.zip*
          if-no-files-found: error
      - name: Publish a verified new version
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (python -c "from app_version import VERSION; print(VERSION)").Trim()
          if ($LASTEXITCODE -ne 0 -or $version -notmatch '^\d+\.\d+\.\d+$') { throw "Invalid version" }
          $tag = "v$version"
          gh release view "$tag" *> $null
          if ($LASTEXITCODE -eq 0) { Write-Host "Release $tag already exists; keeping existing assets."; exit 0 }
          gh release create "$tag" "release/invoice-renamer-windows.zip" "release/invoice-renamer-windows.zip.sha256" --target "$env:GITHUB_SHA" --title "$tag · 发票与文档助手" --notes-file RELEASE_NOTES.md --latest
          if ($LASTEXITCODE -ne 0) { throw "Release publication failed" }
