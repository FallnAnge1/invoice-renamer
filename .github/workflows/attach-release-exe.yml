name: Attach Portable Windows Package to Release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing GitHub Release tag to receive the executable
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-and-attach:
    runs-on: windows-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt

      - name: Prepare bundled OCR engine
        shell: pwsh
        run: ./scripts/prepare_windows_ocr.ps1

      - name: Run regression tests
        # Resolve Windows runner TEMP aliases before creating test fixtures.
        run: python -c "import tempfile, unittest; from pathlib import Path; tempfile.tempdir = str(Path(tempfile.gettempdir()).resolve()); result = unittest.TextTestRunner().run(unittest.defaultTestLoader.discover('.')); raise SystemExit(not result.wasSuccessful())"

      - name: Build portable package
        shell: pwsh
        run: ./scripts/build_windows_release.ps1

      - name: Attach portable package to release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          $app = Start-Process -FilePath "release/发票识别工具/发票识别工具.exe" -ArgumentList @("--self-test", "build-assets/smoke-test") -WindowStyle Hidden -PassThru -Wait
          if ($app.ExitCode -ne 0) { throw "Packaged smoke test failed" }
          Get-Content "build-assets/smoke-test/report.json"
          gh release upload "$env:RELEASE_TAG" "release/invoice-renamer-windows.zip" "release/invoice-renamer-windows.zip.sha256"
          if ($LASTEXITCODE -ne 0) { throw "Release asset upload failed" }
