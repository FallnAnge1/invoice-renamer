name: Attach Portable Windows Package to Release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing GitHub Release tag to receive the executable
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-and-attach:
    runs-on: windows-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt

      - name: Prepare bundled OCR engine
        shell: powershell
        run: ./scripts/prepare_windows_ocr.ps1

      - name: Build portable package
        shell: powershell
        run: ./scripts/build_windows_release.ps1

      - name: Attach portable package to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ inputs.release_tag }}" "release/发票识别工具-windows.zip" --clobber
